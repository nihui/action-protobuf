name: Probe Xcode 27 machine.h

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: xcode-27

    steps:
      - name: Find Xcode 27 CLT
        id: clt
        shell: bash
        run: |
          set -euxo pipefail

          MARKER=/tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
          touch "$MARKER"
          trap 'rm -f "$MARKER"' EXIT

          softwareupdate --list --all 2>&1 | tee /tmp/softwareupdate.txt

          LABEL="$(
            sed -nE \
              's/^[[:space:]]*\*[[:space:]]*Label:[[:space:]]*(.*)$/\1/p' \
              /tmp/softwareupdate.txt |
            grep '^Command Line Tools for Xcode 27\.0' |
            tail -1
          )"

          echo "LABEL=$LABEL"
          test -n "$LABEL"

          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Download Xcode 27 CLT only
        shell: bash
        run: |
          set -euxo pipefail

          sudo softwareupdate \
            --download "${{ steps.clt.outputs.label }}"

          echo
          echo "===== downloaded packages ====="

          sudo find /Library/Updates \
            -type f \
            \( -name '*.pkg' -o -name '*.dist' \) \
            -print || true

      - name: Extract downloaded CLT packages
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$RUNNER_TEMP/clt-packages"
          mkdir -p "$RUNNER_TEMP/clt-expanded"

          # Copy packages out of Software Update cache
          i=0
          while IFS= read -r pkg; do
              echo "Found package: $pkg"

              name="$(basename "$pkg")"
              dst="$RUNNER_TEMP/clt-packages/${i}_${name}"

              sudo cp "$pkg" "$dst"

              out="$RUNNER_TEMP/clt-expanded/pkg_$i"
              mkdir -p "$out"

              pkgutil --expand-full "$dst" "$out" || true

              i=$((i + 1))
          done < <(
              sudo find /Library/Updates \
                -type f \
                -name '*.pkg' \
                -print
          )

          echo
          echo "===== expanded files ====="

          find "$RUNNER_TEMP/clt-expanded" \
            -path '*/usr/include/mach/machine.h' \
            -print

      - name: Dump machine.h
        shell: bash
        run: |
          set -euxo pipefail

          HEADER="$(
              find "$RUNNER_TEMP/clt-expanded" \
                -path '*/usr/include/mach/machine.h' \
                -print |
              head -1
          )"

          echo "HEADER=$HEADER"
          test -n "$HEADER"
          test -f "$HEADER"

          echo
          echo "===== latest CPUFAMILY_ARM definitions ====="
          grep -n 'CPUFAMILY_ARM_' "$HEADER"

          echo
          echo "===== tail ====="
          grep 'CPUFAMILY_ARM_' "$HEADER" | tail -20
