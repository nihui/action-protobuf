name: Probe Xcode 27 machine.h

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: xcode-27

    steps:
      - name: Show environment
        run: |
          sw_vers
          echo
          xcodebuild -version || true
          echo
          xcode-select -p || true

      - name: Find Xcode 27 Command Line Tools
        id: clt
        shell: bash
        run: |
          set -euxo pipefail

          MARKER=/tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
          touch "$MARKER"
          trap 'rm -f "$MARKER"' EXIT

          /usr/sbin/softwareupdate --list --all 2>&1 | tee /tmp/softwareupdate.txt

          echo
          echo "===== Xcode 27 CLT entries ====="
          grep -i 'Command Line Tools.*Xcode.*27' /tmp/softwareupdate.txt || true

          LABEL="$(
            sed -nE \
              's/^[[:space:]]*\*[[:space:]]*Label:[[:space:]]*(.*)$/\1/p' \
              /tmp/softwareupdate.txt |
            grep -i '^Command Line Tools for Xcode 27\.0' |
            tail -1
          )"

          echo "Selected: $LABEL"

          test -n "$LABEL"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Install Xcode 27 Command Line Tools
        shell: bash
        run: |
          sudo /usr/sbin/softwareupdate \
            --install "${{ steps.clt.outputs.label }}" \
            --verbose

      - name: Show installed CLT
        shell: bash
        run: |
          echo "===== CommandLineTools ====="
          ls -la /Library/Developer/CommandLineTools

          echo
          echo "===== SDKs ====="
          ls -la /Library/Developer/CommandLineTools/SDKs

          echo
          echo "===== SDKSettings ====="
          find /Library/Developer/CommandLineTools/SDKs \
            -name SDKSettings.json \
            -maxdepth 2 \
            -print \
            -exec cat {} \; || true

      - name: Dump Xcode 27 machine.h
        shell: bash
        run: |
          set -euxo pipefail

          HEADER="$(
            find /Library/Developer/CommandLineTools/SDKs \
              -path '*/usr/include/mach/machine.h' \
              -print |
            sort -V |
            tail -1
          )"

          echo "HEADER=$HEADER"
          test -f "$HEADER"

          echo
          echo "===== CPUFAMILY_ARM definitions ====="
          grep -n 'CPUFAMILY_ARM_' "$HEADER"

          echo
          echo "===== Full machine.h ====="
          cat "$HEADER"
